name: Weekly Evolution Pipeline

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Site to evolve (matches filename in pipeline/sites/)'
        required: false
        default: 'minesweeper'
        type: string

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.name "Evolution Pipeline"
          git config --global user.email "pipeline@self-evolving-game.dev"

      - name: Run evolution pipeline
        env:
          SITE_ID: ${{ inputs.site_id || 'minesweeper' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BIGQUERY_CREDENTIALS: ${{ secrets.BIG_QUERY_CREDENTIALS }}
          FULLSTORY_API_KEY: ${{ secrets.FULLSTORY_API_KEY }}
          GAME_REPO_URL: https://x-access-token:${{ secrets.GAME_REPO_PAT }}@github.com/davidloesch1/web-game.git
          GAME_REPO_PAT: ${{ secrets.GAME_REPO_PAT }}
        run: python run.py

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: pipeline/*.log
          retention-days: 30
